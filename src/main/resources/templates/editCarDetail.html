<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Car Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/styleForEditCarDetail.css}">
    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Select2 CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/select2/css/select2.min.css}">

    <!-- Fearther CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Boxicons CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/boxicons/css/boxicons.min.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <style>
        ul.breadcrumb {
          padding: 20px;
          list-style: none;
          margin: 0;
        }
        ul.breadcrumb li {
          display: inline;
          font-size: 18px;
        }
        ul.breadcrumb li+li:before {
          padding: 8px;
          color: black;
          content: ">\00a0";
        }

        ul.breadcrumb li a {
          color: #0275d8;
          text-decoration: none;
        }
        ul.breadcrumb li a:hover {
          color: #01447e;
          text-decoration: underline;
        }
    </style>
</head>
<body>

<div th:insert="~{header :: header}"></div>

    <ul class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li><a th:href="@{/cars/myCar}">My Car</a></li>
        <li>Edit details</li>
    </ul>

<main>
    <section class="car-details">
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>
        <h2>Edit Car Details</h2>
        <form th:action="@{/update}" method="post" th:object="${car}"
              enctype="multipart/form-data">
            <input type="hidden" th:field="*{carId}"/>
            <div class="car-images-and-detail">
                <div class="image-slider">
                    <div class="swiper-container">
                        <div class="swiper-wrapper">
                            <!-- Loop through existing images -->
                            <div class="swiper-slide" th:each="image : ${carImages}">
                                <img th:src="'data:image/jpeg;base64,' + ${image}" alt="Car Image">
                            </div>
                        </div>
                        <!-- Navigation buttons -->
                        <div class="swiper-button-next"></div>
                        <div class="swiper-button-prev"></div>
                        <!-- Pagination -->
                        <div class="swiper-pagination"></div>
                    </div>
                </div>

                <div class="car-description">
                    <div class="form-group">
                        <label for="brand">Brand:</label>
                        <input type="text" id="brand" th:value="${car.brand.name}" required readonly/>
                    </div>
                    <div class="form-group">
                        <label for="model">Model:</label>
                        <input type="text" id="model" th:value="${car.model.name}" required readonly/>
                    </div>

                    <div class="form-group">
                        <label for="prodYear">Production Year:</label>
                        <input type="number" id="prodYear" th:field="*{prodYear}" required  min="1900" max="2100"
                               readonly/>
                    </div>

                    <div class="form-group">
                        <label for="pricePerDay">Price Per Day (VND):</label>
                        <input type="number" id="pricePerDay" th:field="*{pricePerDay}" required min="0"
                               oninvalid="this.setCustomValidity('Please enter price per day for renting this car')"
                               oninput="this.setCustomValidity('')" />
                    </div>

                    <div class="form-group">
                        <label for="deposit">Deposit Amount (VND):</label>
                        <input type="number" id="deposit" th:field="*{deposit}" required min="0"
                               oninvalid="this.setCustomValidity('Please enter deposit for rent this car')"
                               oninput="this.setCustomValidity('')" />
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select name="status" class="form-control" id="status">
                            <option value="AVAILABLE" th:selected="${car.status.name == 'AVAILABLE'}">Available</option>
                            <option value="BOOKING" th:selected="${car.status.name == 'BOOKING'}">Booking</option>
                            <option value="STOPPING" th:selected="${car.status.name == 'STOPPING'}">Stopping</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active btn btn-primary" onclick="showTab(0)">Basic Information</div>
                <div class="tab btn btn-primary" onclick="showTab(1)">Details</div>
                <div class="tab btn btn-primary" onclick="showTab(2)">Terms of use</div>
            </div>

            <div class="tab-content active">
                <div class="form-group">
                    <label for="licensePlateNumber">License Plate:</label>
                    <input type="text" id="licensePlateNumber" th:field="*{licensePlateNumber}" required readonly/>
                </div>

                <div class="form-group">
                    <label for="transmission">Transmission:</label>
                    <select id="transmission" th:field="*{transmission}" disabled>
                        <option value="MANUAL">Manual</option>
                        <option value="AUTOMATIC">Automatic</option>
                    </select>
                    <input type="hidden" th:field="*{transmission}"/>
                </div>

                <div class="form-group">
                    <label for="color">Color:</label>
                    <input type="text" id="color" name="displayColor" th:value="${car.color.name}" readonly />
                    <input type="hidden" th:value="${car.color.name}" />
                </div>

                <div class="form-group">
                    <label for="seats">Number of Seats:</label>
                    <select id="seats" th:field="*{seats}" disabled>
                        <option value="2">2</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                        <option value="9">9</option>
                        <option value="12">12</option>
                        <option value="16">16</option>
                    </select>
                    <input type="hidden" th:field="*{seats}"/>
                </div>

                <div class="form-group">
                    <label for="fuel">Fuel Type:</label>
                    <select id="fuel" th:field="*{fuel}" disabled>
                        <option value="GASOLINE">Gasoline</option>
                        <option value="DIESEL">Diesel</option>
                    </select>
                    <input type="hidden" th:field="*{fuel}"/>
                </div>
                <h3>Documents: </h3>
                <table border="1" cellspacing="0" cellpadding="5">
                    <tr>
                        <th>No</th>
                        <th>Name</th>
                        <th>Download</th>
                    </tr>
                    <tr th:each="doc, iterStat : ${car.documents}">
                        <td th:text="${iterStat.count}"></td>
                        <td th:text="${doc.documentName}"></td>
                        <td>
                            <a th:href="@{/download/{id}(id=${doc.docId})}" class="btn btn-primary mb-2 mt-2">
                                Download
                            </a>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="tab-content">
                <div class="form-group">
                    <label for="mileage">Mileage (km):</label>
                    <input type="number" name="mileage" id="mileage" th:field="*{mileage}" min="0"/>
                </div>

                <div class="form-group">
                    <label for="fuelConsumption">Fuel Consumption (liter/100 km):</label>
                    <input type="number" name="fuelConsumption" id="fuelConsumption" th:field="*{fuelConsumption}" step="0.1" min="0"/>
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <div class="form-group">
                        <label>City/Province:</label>
                        <select class="form-control" id="city" name="city" th:field="*{address.ward.cityProvince}"
                                onchange="fetchDistricts()">
                            <option value="">Select City</option>
                            <th:block th:each="city : ${cities}">
                                <option th:value="${city}" th:text="${city}"></option>
                            </th:block>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>District:</label>
                        <select class="form-control" id="district" name="district" th:field="*{address.ward.district}"
                                onchange="fetchWards()">
                            <option value="">Select District</option>
                            <option th:each="d : ${districts}" th:value="${d}" th:text="${d}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ward:</label>
                        <select class="form-control" id="ward" name="wardCode" th:value="*{address.ward.wardCode}">
                            <option value="" th:text="*{address.ward.ward}"></option>
                            <option th:each="w : ${wards}" th:value="${w.wardCode}" th:text="${w.ward}"
                            ></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>House number, Street:</label>
                        <input type="text" name="addressNumber" class="form-control" placeholder="House number, Street"
                               th:value="*{address.addressNumber}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description:</label>
                    <input type="text" name="description" id="description" th:field="*{carDescription}"/>
                </div>

                <div class="form-group">
                    <label>Additional Functions:</label>
                    <div class="checkbox-grid">
                        <label><i class="fas fa-bluetooth"></i>
                            <input type="checkbox" name="hasBluetooth" th:checked="${car.hasBluetooth}" value="true">
                            Bluetooth
                        </label>
                        <label><i class="fas fa-map-marker-alt"></i>
                            <input type="checkbox" name="hasGPS" th:checked="${car.hasGPS}" value="true"> GPS
                        </label>
                        <label><i class="fas fa-camera"></i>
                            <input type="checkbox" name="hasCamera" th:checked="${car.hasCamera}" value="true"> Camera
                        </label>
                        <label><i class="fas fa-sun"></i>
                            <input type="checkbox" name="hasSunRoof" th:checked="${car.hasSunRoof}" value="true"> Sun
                            roof
                        </label>
                        <label><i class="fas fa-lock"></i>
                            <input type="checkbox" name="hasChildLock" th:checked="${car.hasChildLock}" value="true">
                            Child lock
                        </label>
                        <label><i class="fas fa-child"></i>
                            <input type="checkbox" name="hasChildSeat" th:checked="${car.hasChildSeat}" value="true">
                            Child seat
                        </label>
                        <label><i class="fas fa-compact-disc"></i>
                            <input type="checkbox" name="hasDVD" th:checked="${car.hasDVD}" value="true"> DVD
                        </label>
                        <label><i class="fas fa-usb"></i>
                            <input type="checkbox" name="hasUSB" th:checked="${car.hasUSB}" value="true"> USB
                        </label>
                    </div>
                </div>
                <h3>Current Images</h3>
                <div class="image-upload ">
                    <div class="current-images">
                        <!-- This would display thumbnails of current images with delete buttons -->
                        <div class="image-thumbnail" th:each="image, status : ${carImages}">
                            <img th:src="'data:image/jpeg;base64,' + ${image}" alt="Car Image">
                            <!--                            <span th:text="${carImages[__${status.index}__]}"></span>-->
                            <!--                            <button type="button" class="delete-image" th:attr="data-index=${status.index}">×</button>-->
                        </div>
                    </div>
                    <div class="image-update">
                        <div class="upload-box">
                            <label>Front:</label>
                            <input type="file" name="frontImage" id="frontImage" accept="image/*"
                                   onchange="previewImage(event, 'frontImage')">
                            <img id="frontImagePreview" class="preview-image" style="display:none;"/>
                        </div>
                        <div class="upload-box">
                            <label>Back:</label>
                            <input type="file" name="backImage" id="backImage" accept="image/*"
                                   onchange="previewImage(event, 'backImage')">
                            <img id="backImagePreview" class="preview-image" style="display:none;"/>
                        </div>
                        <div class="upload-box">
                            <label>Left:</label>
                            <input type="file" name="leftImage" id="leftImage" accept="image/*"
                                   onchange="previewImage(event, 'leftImage')">
                            <img id="leftImagePreview" class="preview-image" style="display:none;"/>
                        </div>
                        <div class="upload-box">
                            <label>Right:</label>
                            <input type="file" name="rightImage" id="rightImage" accept="image/*"
                                   onchange="previewImage(event, 'rightImage')">
                            <img id="rightImagePreview" class="preview-image" style="display:none;"/>
                        </div>
                    </div>
                    <input type="file" id="carImages" name="carImageFiles" multiple accept="image/*"
                           style="display: none;"/>
                    <button type="button" class="image-upload-btn mt-2"
                            onclick="document.getElementById('carImages').click()">
                        <i class="fas fa-upload"></i> Upload Images
                    </button>
                    <div id="fileList" style="font-size: 14px; margin-top: 5px;"></div>
                </div>
            </div>

            <div class="tab-content">
                <div class="form-group">
                    <label>Terms of Use:</label>
                    <div class="checkbox-group">
                        <div>
                            <input type="checkbox" th:field="*{noSmoking}" id="noSmoking"/>
                            <label for="noSmoking">No Smoking</label>
                        </div>
                        <div>
                            <input type="checkbox" th:field="*{noPet}" id="noPet"/>
                            <label for="noPet">No Pet</label>
                        </div>
                        <div>
                            <input type="checkbox" th:field="*{noFood}" id="noFoodInCar"/>
                            <label for="noFoodInCar">No Food In Car</label>
                        </div>
                        <div>
                            <input type="checkbox" th:field="*{otherTerm}" id="otherTerm"/>
                            <label for="otherTerm">Other</label>
                        </div>
                    </div>

                    <div class="form-group" name="otherTermDetails" id="otherTermDetails" style="display: none;">
                        <label for="otherTermText">Other Terms (please specify):</label>
                        <textarea id="otherTermText" th:field="*{otherTermDescription}"></textarea>
                    </div>
                </div>
            </div>

            <div class="form-actions ">
                <button type="button" class="btn btn-secondary mb-4" id="cancelButton" onclick="window.location.href='/'">Cancel</button>
                <button type="submit" class="btn btn-primary mb-4">Save Changes</button>
            </div>
        </form>
    </section>
</main>

<!-- Footer -->
<div th:insert="~{footer :: footer}"></div>
<!-- /Footer -->
</div>

<script>

    document.addEventListener("DOMContentLoaded", function () {
        // Get the car status from the select element
        const statusSelect = document.getElementById("status");

        if (statusSelect) {
            const currentStatus = statusSelect.value;

            // If current status is BOOKING, disable all form elements
            if (currentStatus === "BOOKING") {
                // Disable all input, textarea, select elements except the cancel button
                const formElements = document.querySelectorAll("input:not([type='hidden']), textarea, select, button[type='submit']");

                formElements.forEach(function (el) {
                    if (el.id !== "cancelButton") {
                        el.disabled = true;
                    }
                });

                // Show warning message
                const alert = document.createElement("div");
                alert.className = "alert alert-warning mt-3";
                alert.innerText = "You cannot edit car details while the car is in BOOKING status.";

                // Insert at the top of the form
                const form = document.querySelector("form");
                form.prepend(alert);

                // Add overlay to prevent any interaction with the form
                const formOverlay = document.createElement("div");
                formOverlay.className = "form-overlay";
                formOverlay.style.position = "absolute";
                formOverlay.style.top = "0";
                formOverlay.style.left = "0";
                formOverlay.style.width = "100%";
                formOverlay.style.height = "100%";
                // formOverlay.style.backgroundColor = "rgba(200, 200, 200, 0.3)";
                formOverlay.style.zIndex = "10";
                formOverlay.style.pointerEvents = "none";

                // Make form position relative to contain the overlay
                form.style.position = "relative";
                form.appendChild(formOverlay);
            }
            // If current status is AVAILABLE or STOPPING, hide the BOOKING option
            else if (currentStatus === "AVAILABLE" || currentStatus === "STOPPING") {
                // Remove the BOOKING option from the status dropdown
                for (let i = 0; i < statusSelect.options.length; i++) {
                    if (statusSelect.options[i].value === "BOOKING") {
                        statusSelect.options[i].style.display = "none";
                        // Alternatively, you can completely remove the option
                        // statusSelect.remove(i);
                        break;
                    }
                }
            }
        }
    });
</script>

</body>
</html>
