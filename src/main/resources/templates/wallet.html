<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Dreams Rent | My Wallet</title>
    <link rel="stylesheet" th:href="@{/css/styleForWallet.css}">
    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Datatables CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/datatables/datatables.min.css}">

    <!-- Feather CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <script src="/js/script.js" defer></script>

    <style>
        ul.breadcrumb {
          padding: 20px;
          list-style: none;
          margin: 0;
        }
        ul.breadcrumb li {
          display: inline;
          font-size: 18px;
        }
        ul.breadcrumb li+li:before {
          padding: 8px;
          color: black;
          content: ">\00a0";
        }

        ul.breadcrumb li a {
          color: #0275d8;
          text-decoration: none;
        }
        ul.breadcrumb li a:hover {
          color: #01447e;
          text-decoration: underline;
        }
    </style>

</head>
<body>

<!-- Main Wrapper -->
<div class="main-wrapper">

    <div th:insert="~{header :: header}"></div>

    <!-- Breadcrumb Section -->
    <ul class="breadcrumb">
        <li><a href="/">Home</a></li>
        <li>My Wallet</li>
    </ul>

    <!-- Notification Area -->
    <div class="notification-area container mt-3" th:if="${error != null || success != null}" style="display: none;">
        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
            <strong><i class="fas fa-exclamation-circle"></i> Error!</strong>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${success}">
            <strong><i class="fas fa-check-circle"></i> Success!</strong>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Page Content -->
    <div class="content">
        <div class="container">

            <!-- Wallet Info -->
            <div class="row">
                <div class="col-lg-12 col-md-12 d-flex">
                    <div class="card wallet-card flex-fill">
                        <div class="card-body">
                            <div class="balance-actions">
                                <div>
                                    <p>Your current balance:</p>
                                    <div class="balance"
                                         th:text="${wallet != null ? walletBalance + ' VND' : '0 VND'}"></div>
                                </div>

                                <div class="actions">
                                    <button class="WITHDRAW" onclick="showDialog('WITHDRAWAL')">Withdraw</button>
                                    <button class="TOP_UP" onclick="showDialog('TOP_UP')">Top-up</button>
                                </div>
                            </div>

                            <div id="dialog" class="dialog">
                                <div class="dialog-content">
                                    <h3 id="dialog-title">WITHDRAW</h3>
                                    <p>Your current balance is <span
                                            th:text="${wallet != null ? walletBalance + ' VND' : '0 VND'}"></span>.
                                        Please select the amount:</p>
                                    <form id="walletForm" th:action="@{/updateWallet}" method="post">
                                        <input type="hidden" id="transactionType" name="transactionType">

                                        <select name="amount">
                                            <option value="2000000">2,000,000</option>
                                            <option value="5000000">5,000,000</option>
                                            <option value="10000000">10,000,000</option>
                                            <option value="ALL">All balance</option>
                                        </select>

                                        <div class="dialog-actions">
                                            <button type="button" onclick="closeDialog()">Cancel</button>
                                            <button type="submit">OK</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- Search Section -->
                            <div class="wallet-search mt-3">
                                <form th:action="@{/myWallet}" method="get" class="date-filter">
                                    <div class="date-inputs">
                                        <label for="fromDateWallet">From</label>
                                        <input type="date" id="fromDateWallet" name="fromDate" th:value="${fromDate}">
                                    </div>
                                    <div class="date-inputs">
                                        <label for="toDateWallet">To</label>
                                        <input type="date" id="toDateWallet" name="toDate" th:value="${toDate}">
                                    </div>
                                    <button type="submit" class="btn btn-primary">Search</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /Wallet Info -->

            <!-- Wallet Table -->
            <div class="row">
                <div class="col-lg-12 d-flex">
                    <div class="card book-card flex-fill mb-0">
                        <div class="card-header">
                            <div class="row align-items-center">
                                <div class="col-md-5">
                                    <h4>Wallet Usage History</h4>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive dashboard-table">
                                <table class="table table-striped table-hover">
                                    <thead class="thead-light">
                                    <tr>
                                        <th>No</th>
                                        <th>Amount</th>
                                        <th>Type</th>
                                        <th>Date Time</th>
                                        <th>Booking No.</th>
                                        <th>Car Name</th>
                                        <th>Note</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="transaction, iterStat : ${transactions}">
                                        <td th:text="${iterStat.index + 1 + (currentPage * pageSize)}"></td>
                                        <td th:text="|${transaction.transactionType.name() == 'TOP_UP' || transaction.transactionType.name() == 'RECEIVE_DEPOSIT' || transaction.transactionType.name() == 'RECEIVE_PAYMENT' || transaction.transactionType.name() == 'RECEIVE_REFUND' || transaction.transactionType.name() == 'REFUND_DEPOSIT' ? '+' : '-'} ${#numbers.formatDecimal(transaction.amount, 0, 'COMMA', 0, 'NONE')} VND|"
                                            th:class="${transaction.transactionType.name() == 'TOP_UP' || transaction.transactionType.name() == 'RECEIVE_DEPOSIT' || transaction.transactionType.name() == 'RECEIVE_PAYMENT' || transaction.transactionType.name() == 'RECEIVE_REFUND' || transaction.transactionType.name() == 'REFUND_DEPOSIT' ? 'text-success-light' : 'text-danger'}"></td>
                                        <td th:text="${transaction.transactionType}"></td>
                                        <td th:text="${#temporals.format(transaction.createdAt, 'dd-MM-yyyy HH:mm:ss')}"></td>
                                        <td th:text="${transaction.booking != null ? transaction.booking.bookingId : 'N/A'}"></td>
                                        <td th:text="${transaction.booking != null ? transaction.booking.car.brand.name + ' ' + transaction.booking.car.model.name : 'N/A'}"></td>
                                        <td th:text="${transaction.booking != null ? transaction.booking.comments : ''}"></td>
                                    </tr>
                                    <tr th:if="${transactions.isEmpty()}">
                                        <td colspan="7" class="text-center">No transactions found</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <!-- Page Size Form -->
                            <form method="get" th:action="@{/myWallet}" class="page-size-form mt-3">
                                <label for="pageSize">Records per page:</label>
                                <input type="number" id="pageSize" name="size" th:value="${pageSize}" min="1" step="1"
                                       required>
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <input type="hidden" name="fromDate" th:value="${fromDate}">
                                <input type="hidden" name="toDate" th:value="${toDate}">
                                <button type="submit" class="btn btn-secondary">Apply</button>
                            </form>
                            <!-- Pagination -->
                            <div class="pagination mt-3">
                                <a th:if="${currentPage > 0}"
                                   th:href="@{/myWallet(page=${currentPage - 1}, size=${pageSize}, fromDate=${fromDate}, toDate=${toDate})}">
                                    <i class="feather-arrow-left"></i> Previous
                                </a>
                                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                                    <a th:href="@{/myWallet(page=${i}, size=${pageSize}, fromDate=${fromDate}, toDate=${toDate})}"
                                       th:text="${i + 1}"
                                       th:classappend="${i == currentPage} ? 'active' : ''"></a>
                                </span>
                                <a th:if="${currentPage + 1 < totalPages}"
                                   th:href="@{/myWallet(page=${currentPage + 1}, size=${pageSize}, fromDate=${fromDate}, toDate=${toDate})}">
                                    Next <i class="feather-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- /Wallet Table -->

        </div>
    </div>
    <!-- /Page Content -->

    <!-- Footer -->
    <div th:insert="~{footer :: footer}"></div>
    <!-- /Footer -->
</div>

<!-- Scripts -->
<script th:src="@{/assets/js/jquery-3.7.1.min.js}"></script>

<!-- Custom JavaScript -->
<script type="text/javascript">
    function setTransactionType(type) {
        document.getElementById('transactionType').value = type;
        document.getElementById('modal-title').textContent = type === 'TOP_UP' ? 'Top-up Wallet' : 'Withdraw from Wallet';
    }
</script>
