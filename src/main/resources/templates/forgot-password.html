<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Dreams Rent | Forgot Password</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Feather CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <style>
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

<!-- Main Wrapper -->
<div class="main-wrapper login-body">
    <div th:insert="~{header :: header}"></div>

    <div class="login-wrapper">
        <div class="loginbox">
            <div class="login-auth">
                <div class="login-auth-wrap">
                    <div class="sign-group">
                        <a href="/" class="btn sign-up"><span><i class="fe feather-corner-down-left"
                                                                 aria-hidden="true"></i></span> Back To Home</a>
                    </div>
                    <h1>Forgot Password</h1>
                    <p class="account-subtitle">Enter the email address associated with your account, and we'll email
                        you the link to reset your password.</p>

                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Hiển thị thông báo thành công -->
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <span th:text="${success}"></span>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/forgot-password}" method="post" onsubmit="showAlert(event)" id="resetForm">
                        <div class="input-block">
                            <label class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" placeholder="Your email address"
                                   th:value="${enteredEmail}" required>
                        </div>
                        <button type="submit" class="btn btn-outline-light w-100 btn-size">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- /Main Wrapper -->

<!-- Custom Modal -->
<div id="customModal" class="modal">
    <div class="modal-content">
        <p>If this email address exists, we’ll send an email with the link to reset your password.</p>
        <button class="btn btn-primary" onclick="closeModal()">OK</button>
    </div>
</div>



<!-- JS Scripts -->
<script src="/assets/js/jquery-3.7.1.min.js"></script>
<script src="/assets/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/script.js"></script>

<!-- Custom JS -->
<script>
    function showAlert(event) {
        event.preventDefault(); // Ngăn không cho form submit ngay lập tức
        document.getElementById("customModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("customModal").style.display = "none";
        document.getElementById("resetForm").submit(); // Gửi form sau khi người dùng nhấn OK
    }
</script>

</body>
</html>
