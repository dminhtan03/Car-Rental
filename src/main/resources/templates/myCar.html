<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cars - Car Rental</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/styleForMyCar.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Select2 CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/select2/css/select2.min.css}">

    <!-- Fearther CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Boxicons CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/boxicons/css/boxicons.min.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <style>
        ul.breadcrumb {
            padding: 20px;
            list-style: none;
            margin: 0;
        }
        ul.breadcrumb li {
            display: inline;
            font-size: 18px;
        }
        ul.breadcrumb li+li:before {
            padding: 8px;
            color: black;
            content: ">\00a0";
        }

        ul.breadcrumb li a {
            color: #0275d8;
            text-decoration: none;
        }
        ul.breadcrumb li a:hover {
            color: #01447e;
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div th:insert="~{header :: header}"></div>

<ul class="breadcrumb">
    <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
    <li><i class="fas fa-car"></i> My Cars</li>
</ul>

<main>
    <section class="car-list">
        <div class="section-header">
            <h2><i class="fas fa-list"></i> List Of Cars</h2>
            <div th:if="${success}" class="alert alert-success" role="alert">
                <span th:text="${success}"></span>
            </div>
            <div class="car-header">
                <button class="add-car-button" onclick="location.href='/cars/add'">
                    <i class="fas fa-plus"></i> Add New Car
                </button>
                <form method="get" action="/cars/myCar" id="sortForm" class="sort-form">
                    <label for="sortDropdown"><i class="fas fa-sort"></i> Sort by:</label>
                    <select id="sortDropdown" name="sort" onchange="document.getElementById('sortForm').submit();">
                        <option value="prodYear,desc" th:selected="${sort == 'prodYear,desc'}">Newest to Latest</option>
                        <option value="prodYear,asc" th:selected="${sort == 'prodYear,asc'}">Latest to Newest</option>
                        <option value="pricePerDay,asc" th:selected="${sort == 'pricePerDay,asc'}">Price: Low to High</option>
                        <option value="pricePerDay,desc" th:selected="${sort == 'pricePerDay,desc'}">Price: High to Low</option>
                    </select>
                    <input type="hidden" name="page" th:value="${currentPage}">
                    <input type="hidden" name="size" th:value="${pageSize}">
                </form>
            </div>
        </div>

        <div th:if="${carList.isEmpty()}" class="no-cars-message">
            <i class="fas fa-car-slash fa-3x"></i>
            <p>No cars found. Please check your filters or add a new car!</p>
        </div>

        <div th:each="car, iterStat : ${carList.content}" class="car-item">
            <div class="car-images-and-detail">
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide" th:each="image : ${carImageMap[car.carId]}">
                            <img th:src="'data:image/jpeg;base64,' + ${image}" alt="Car Image">
                        </div>
                    </div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-pagination"></div>
                </div>

                <div class="car-info-and-actions">
                    <div class="car-info">
                        <h3 th:text="${car.brand.name} + ' ' + ${car.model.name} + ' (' + ${car.prodYear} + ')'"></h3>
                        <div class="info-grid">
                            <p><i class="fas fa-hashtag"></i> License: <span th:text="${car.licensePlateNumber}"></span></p>
                            <p><i class="fas fa-road"></i> Mileage: <span th:text="${#numbers.formatDecimal(car.mileage, 0, 'COMMA', 0, 'POINT')}"></span></p>
                            <p><i class="fas fa-tag"></i> Price: <span th:text="${#numbers.formatDecimal(car.pricePerDay, 0, 'COMMA', 0, 'POINT')} + ' VND/Day'"></span></p>
                            <p><i class="fas fa-map-marker-alt"></i> Location: <span th:text="${car.address.ward.district} + ', ' + ${car.address.ward.cityProvince}"></span></p>
                            <p><i class="fas fa-info-circle"></i> Status: <span class="status" th:classappend="${car.status}" th:text="${car.status}"></span></p>
                        </div>
                    </div>

                    <div class="car-actions">
                        <button class="view-details" th:onclick="|location.href='/edit/' + ${car.carId}|">
                            <i class="fas fa-edit"></i> View Details
                        </button>
                        <input type="hidden" name="carID" th:value="${car.carId}">
                        <div id="actionButton"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="pagination-controls">
            <form method="get" action="/cars/myCar" class="page-size-form">
                <label for="pageSize"><i class="fas fa-list-ol"></i> Records per page:</label>
                <input type="number" id="pageSize" name="size" th:value="${pageSize}" min="1" step="1" required>
                <input type="hidden" name="page" th:value="${currentPage}">
                <button type="submit" class="btn btn-primary">Apply</button>
            </form>
            <div class="pagination">
                <a th:if="${currentPage > 0}" th:href="@{/cars/myCar(page=${currentPage - 1}, size=${pageSize})}">
                    <i class="fas fa-chevron-left"></i> Previous
                </a>
                <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                    <a th:href="@{/cars/myCar(page=${i}, size=${pageSize})}" 
                       th:text="${i + 1}"
                       th:classappend="${i == currentPage} ? 'active' : ''"></a>
                </span>
                <a th:if="${currentPage + 1 < totalPages}" 
                   th:href="@{/cars/myCar(page=${currentPage + 1}, size=${pageSize})}">
                    Next <i class="fas fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </section>
</main>
<div id="logoutModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-sign-out-alt"></i> Log Out</h3>
        <p>Are you sure you want to log out?</p>
        <div class="modal-buttons">
            <button id="cancel" class="btn btn-secondary">Cancel</button>
            <button id="confirmLogout" class="btn btn-danger">OK</button>
        </div>
    </div>
</div>

<!-- Footer -->
<div th:insert="~{footer :: footer}"></div>
<!-- /Footer -->
<!-- jQuery -->
<script src="/assets/js/jquery-3.7.1.min.js"></script>

<!-- Bootstrap Core JS -->
<script src="/assets/js/bootstrap.bundle.min.js"></script>

<!-- counterup JS -->
<script src="/assets/js/jquery.waypoints.js"></script>
<script src="/assets/js/jquery.counterup.min.js"></script>

<!-- Select2 JS -->
<script src="/assets/plugins/select2/js/select2.min.js"></script>

<!-- Aos -->
<script src="/assets/plugins/aos/aos.js"></script>

<!-- Top JS -->
<script src="/assets/js/backToTop.js"></script>

<!-- Datepicker Core JS -->
<script src="/assets/plugins/moment/moment.min.js"></script>
<script src="/assets/js/bootstrap-datetimepicker.min.js"></script>

<!-- Owl Carousel JS -->
<script src="/assets/js/owl.carousel.min.js"></script>

<!-- Custom JS -->
<script src="/assets/js/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize Swiper
        const swipers = document.querySelectorAll('.swiper-container');
        swipers.forEach(swiperElement => {
            new Swiper(swiperElement, {
                loop: true,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true
                },
                navigation: {
                    nextEl: '.swiper-button-next',
                    prevEl: '.swiper-button-prev'
                }
            });
        });
    });
</script>
</body>
</html>
