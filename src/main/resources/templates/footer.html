<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Select2 CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/select2/css/select2.min.css}">

    <!-- Datepicker CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap-datetimepicker.min.css}">

    <!-- Aos CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/aos/aos.css}">

    <!-- Fearther CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Owl carousel CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/owl.carousel.min.css}">

    <!-- Boxicons CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/boxicons/css/boxicons.min.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<!-- Footer -->
<footer class="footer" th:fragment="footer">
    <div class="footer-top">
        <div class="container">
            <div class="row">
                <!-- RENT CARS Column -->
                <div class="col-lg-4 col-md-6">
                    <div class="footer-widget footer-menu">
                        <h5 class="footer-title">RENT CARS</h5>
                        <ul>
                            <!-- Display only for Guest (null role) or Customer -->
                            <li th:if="${role == null || role == 'CUSTOMER'}">
                                <a th:href="${role == 'CUSTOMER' ? '/' : '/login'}">
                                    Search Cars and Rates
                                </a>
                                <!-- If logged in as Customer: links to Homepage (UC07) -->
                                <!-- If not logged in (Guest): links to Login (UC01) -->
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- CUSTOMER ACCESS Column -->
                <div class="col-lg-4 col-md-6">
                    <div class="footer-widget footer-menu">
                        <h5 class="footer-title">CUSTOMER ACCESS</h5>
                        <ul>
                            <!-- Manage My Booking: Display for Guest or Customer -->
                            <li th:if="${role == null || role == 'CUSTOMER'}">
                                <a th:href="${role == 'CUSTOMER' ? '/bookings/myBookingList' : '/login'}">
                                    Manage My Booking
                                </a>
                                <!-- If logged in as Customer: links to My Booking List (UC11) -->
                                <!-- If not logged in (Guest): links to Login (UC01) -->
                            </li>

                            <!-- My Wallet: Display for all, conditional link -->
                            <li>
                                <a th:href="${role != null ? '/myWallet' : '/login'}">
                                    My Wallet
                                </a>
                                <!-- If logged in: links to My Wallet (UC24) -->
                                <!-- If not logged in: links to Login (UC01) -->
                            </li>

                            <!-- My Car: Display for Guest or Car Owner -->
                            <li th:if="${role == null || role == 'CAR_OWNER'}">
                                <a th:href="${role != null ? '/cars/myCar' : '/login'}">
                                    My Car
                                </a>
                                <!-- If logged in as Car Owner: links to My Cars (UC19) -->
                                <!-- If not logged in (Guest): links to Login (UC01) -->
                            </li>

                            <!-- Log In: Display only if not logged in -->
                            <li th:if="${role == null}">
                                <a th:href="'/login'">Log In</a>
                                <!-- Links to Login (UC01) -->
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- JOIN US Column -->
                <div class="col-lg-4 col-md-6">
                    <div class="footer-widget footer-menu">
                        <h5 class="footer-title">JOIN US</h5>
                        <ul>
                            <!-- New User Sign Up: Display only if not logged in -->
                            <li th:if="${role == null}">
                                <a th:href="'/login'">New User Sign Up</a>
                                <!-- Links to Sign Up (UC04) -->
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

</footer>
<!-- /Footer -->
<!-- jQuery -->
<script src="/assets/js/jquery-3.7.1.min.js"></script>

<!-- Bootstrap Core JS -->
<script src="/assets/js/bootstrap.bundle.min.js"></script>

<!-- counterup JS -->
<script src="/assets/js/jquery.waypoints.js"></script>
<script src="/assets/js/jquery.counterup.min.js"></script>

<!-- Select2 JS -->
<script src="/assets/plugins/select2/js/select2.min.js"></script>

<!-- Aos -->
<script src="/assets/plugins/aos/aos.js"></script>

<!-- Top JS -->
<script src="/assets/js/backToTop.js"></script>

<!-- Datepicker Core JS -->
<script src="/assets/plugins/moment/moment.min.js"></script>
<script src="/assets/js/bootstrap-datetimepicker.min.js"></script>

<!-- Owl Carousel JS -->
<script src="/assets/js/owl.carousel.min.js"></script>

<!-- Custom JS -->
<script src="/assets/js/script.js"></script>
</body>
</html>
