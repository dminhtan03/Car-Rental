<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Dreams Rent | Template</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Fearther CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <style>
        .password-note {
        font-size: 12px;
        color: gray;
        }
    </style>
</head>
<body>

<!-- Main Wrapper -->
<div class="main-wrapper login-body">
    <div th:insert="~{header :: header}"></div>

    <div class="login-wrapper">
        <div class="loginbox">
            <div class="login-auth">
                <div class="login-auth-wrap">
                    <div class="sign-group">
                        <a href="/" class="btn sign-up"><span><i class="fe feather-corner-down-left"
                                                                 aria-hidden="true"></i></span> Back To Home</a>
                    </div>
                    <h1>Reset Password</h1>
                    <p class="account-subtitle">Please set your new password</p>
                    <!-- Hiển thị thông báo lỗi -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>

                    <!-- Hiển thị thông báo thành công -->
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <span th:text="${success}"></span>
                    </div>

                    <form th:action="@{/forgot-password/reset}" method="post" onsubmit="return validatePassword()">
                        <input type="hidden" name="token" th:value="${token}"/>
                        <div class="input-block">
                            <label class="form-label">New Password <span class="text-danger">*</span></label>
                            <div class="pass-group position-relative">
                                <input type="password" id="newPassword" name="newPassword"
                                       class="form-control" placeholder="Pick a password" required>
                                <span class="toggle-password" onclick="toggleVisibility('newPassword', this)"
                                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
            <i class="fas fa-eye"></i>
        </span>
                                <p class="password-note">Use at least one letter, one number, and seven characters.</p>
                            </div>
                        </div>


                        <div class="input-block">
                            <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
                            <div class="pass-group position-relative">
                                <input type="password" id="confirmPassword" name="confirmPassword"
                                       class="form-control" placeholder="Confirm password" required>
                                <span class="toggle-password" onclick="toggleVisibility('confirmPassword', this)"
                                      style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
            <i class="fas fa-eye"></i>
        </span>
                            </div>
                        </div>

                        <button class="btn btn-outline-light w-100 btn-size">RESET</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>
<!-- /Main Wrapper -->
<script>
    function validatePassword() {
        var newPassword = document.getElementById("newPassword").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword.length < 7 || !/\d/.test(newPassword) || !/[a-zA-Z]/.test(newPassword)) {
            alert("Password must contain at least one number, one numeral, and seven characters");
            return false;
        }
        if (newPassword !== confirmPassword) {
            alert("Password and Confirm password don’t match. Please try again.");
            return false;
        }
        return true;
    }
     function toggleVisibility(inputId, iconElement) {
        const input = document.getElementById(inputId);
        const icon = iconElement.querySelector('i');

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

</script>
