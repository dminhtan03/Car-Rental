<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rent a Car - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login.css}">
    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Select2 CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/select2/css/select2.min.css}">

    <!-- Datepicker CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap-datetimepicker.min.css}">

    <!-- Aos CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/aos/aos.css}">

    <!-- Fearther CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Owl carousel CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/owl.carousel.min.css}">

    <!-- Boxicons CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/boxicons/css/boxicons.min.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --light-bg: #f8f9fa;
            --text-color: #333;
            --error-color: #e74c3c;
            --success-color: #27ae60;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ecf0f1;
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-login {
            display: flex;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .logo img {
            height: 40px;
            margin-right: 10px;
        }

        .nav-links-login ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links-login li {
            margin-left: 20px;
        }

        .nav-links-login a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .nav-links-login a:hover {
            color: var(--accent-color);
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
        }

        .auth-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .tab-container {
            width: 100%;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 1px solid #eee;
        }

        .tab-button {
            flex: 1;
            background: none;
            border: none;
            padding: 18px 0;
            font-size: 16px;
            font-weight: 700;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            outline: none;
        }

        .tab-button.active {
            color: var(--primary-color);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-color);
        }

        .tab-content {
            padding: 30px;
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-content h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--primary-color);
            font-size: 20px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-color);
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.2);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #999;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--accent-color);
        }

        .alert-success {
            color: #155724;         /* Màu xanh chuẩn */
            background-color: #d4edda; /* Nền xanh nhạt */
            border-color: #c3e6cb;
        }

        .alert i {
            margin-right: 8px;
        }

        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 5px;
            display: flex;
            align-items: center;
        }

        .error-message i {
            margin-right: 5px;
        }

        .password-requirements {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 5px;
        }

        .radio-group div {
            display: flex;
            align-items: center;
        }

        .radio-group input[type="radio"] {
            margin-right: 8px;
            accent-color: var(--accent-color);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .terms input {
            margin-right: 8px;
            margin-top: 3px;
            accent-color: var(--accent-color);
        }

        .terms a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .login-btn, .signup-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .login-btn:hover, .signup-btn:hover {
            background-color: #d35400;
        }

        #password-strength {
            height: 5px;
            margin-top: 8px;
            border-radius: 3px;
            background: #eee;
            overflow: hidden;
        }

        #password-strength div {
            height: 100%;
            width: 0;
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .nav-links-login ul {
                gap: 10px;
            }

            .nav-links-login li {
                margin-left: 10px;
            }

            .auth-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
<div th:insert="~{header :: header}"></div>

<div class="auth-container">
    <div class="auth-card">
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" onclick="openTab(event, 'login')" data-tab="login">Log In</button>
                <button class="tab-button" onclick="openTab(event, 'signup')" data-tab="signup">Sign Up</button>
            </div>


            <div id="login" class="tab-content active">
                <h2>Welcome Back</h2>
                <!-- Hiển thị thông báo thành công -->
                <div th:if="${success}" class="alert-success" role="alert">
                    <span th:text="${success}"></span>
                </div>
                <br>

                <form th:action="@{/auth/login}" method="post">
                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-circle"></i> Either email address or password is incorrect. Please
                        try again
                    </div>
                    <div class="form-group">
                        <label for="login-email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" id="login-email" placeholder="Your email address" required/>
                    </div>
                    <div class="form-group">
                        <label for="login-password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-container">
                            <input type="password" name="password" id="login-password" placeholder="Password" required/>
                            <span class="toggle-password" onclick="togglePassword('login-password')">
                                <i class="fas fa-eye" id="eye-icon-login-password"></i>
                            </span>
                        </div>
                        <p style="text-align: right; margin-top: 8px;">
                            <a th:href="@{/forgot-password}"
                               style="color: var(--accent-color); text-decoration: none; font-size:14px">
                                Forgot password?
                            </a>
                        </p>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> LOG IN
                    </button>
                </form>
            </div>

            <div id="signup" class="tab-content">
                <h2>Create Your Account</h2>
                <form th:action="@{/auth/register}" method="post">
                    <div class="form-group">
                        <label for="fullName"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Your name" required
                               th:value="${user != null ? user.fullName : ''}"/>
                    </div>

                    <div class="form-group">
                        <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Your email address" required
                               th:value="${user != null ? user.email : ''}"/>
                        <div th:if="${emailError}" class="error-message">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${emailError}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Your phone number" required
                               th:value="${user != null ? user.phone : ''}"/>
                        <div th:if="${phoneError}" class="error-message">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${phoneError}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="register-password"><i class="fas fa-lock"></i> Password</label>
                        <div class="password-container">
                            <input type="password" name="password" id="register-password" placeholder="Password"
                                   required onkeyup="checkPassword()" th:value="${user != null ? user.password : ''}"/>
                            <span class="toggle-password" onclick="togglePassword('register-password')">
                                <i class="fas fa-eye" id="eye-icon-register-password"></i>
                            </span>
                        </div>
                        <div class="password-requirements">
                            <i class="fas fa-info-circle"></i> Use at least one letter, one number, and seven
                            characters.
                        </div>
                        <div id="password-strength"></div>
                        <div th:if="${passwordError}" class="error-message">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${passwordError}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
                        <div class="password-container">
                            <input type="password" name="confirmPassword" id="confirmPassword"
                                   placeholder="Confirm password"
                                   required th:value="${user != null ? user.password : ''}"/>
                            <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                                <i class="fas fa-eye" id="eye-icon-confirmPassword"></i>
                            </span>
                        </div>
                        <div th:if="${confirmPasswordError}" class="error-message">
                            <i class="fas fa-exclamation-circle"></i> <span th:text="${confirmPasswordError}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user-tag"></i> Account Type</label>
                        <div class="radio-group">
                            <div>
                                <input type="radio" value="CUSTOMER" name="role" id="rent"
                                       th:checked="${user != null and user.role == 'CUSTOMER'}"/>
                                <label for="rent">I want to rent a car</label>
                            </div>
                            <div>
                                <input type="radio" value="CAR_OWNER" name="role" id="owner"
                                       th:checked="${user != null and user.role == 'CAR_OWNER'}"/>
                                <label for="owner">I am a car owner</label>
                            </div>
                        </div>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="agree" required/>
                        <label for="agree">
                            I have read and agree with the
                            <a th:href="@{/termOfUser/showTerm}">Terms and Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> SIGN UP
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
<script>
    function togglePassword(inputId) {
        const passwordInput = document.getElementById(inputId);
        const eyeIcon = document.getElementById('eye-icon-' + inputId);

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    function openTab(evt, tabName) {
        const tabContents = document.getElementsByClassName('tab-content');
        for (let i = 0; i < tabContents.length; i++) {
            tabContents[i].classList.remove('active');
        }

        const tabButtons = document.getElementsByClassName('tab-button');
        for (let i = 0; i < tabButtons.length; i++) {
            tabButtons[i].classList.remove('active');
        }

        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');

        // Lưu lại tab hiện tại vào localStorage
        localStorage.setItem('selectedTab', tabName);
    }

    document.addEventListener('DOMContentLoaded', function () {
        let selectedTab = localStorage.getItem('selectedTab') || 'login';

        // Nếu có lỗi trong tab signup → override sang 'signup'
        const signupHasError = document.querySelector('#signup .error-message');
        if (signupHasError) {
            selectedTab = 'signup';
            localStorage.setItem('selectedTab', 'signup');
        }

        // Kiểm tra nếu có thông báo thành công (Đăng ký thành công)
        const successMessage = document.querySelector('.alert-success');
        if (successMessage) {
            selectedTab = 'login';  // Chuyển về tab Login khi đăng ký thành công
            localStorage.setItem('selectedTab', 'login');
        }

        // Kích hoạt tab content
        const tabContents = document.getElementsByClassName('tab-content');
        for (let i = 0; i < tabContents.length; i++) {
            tabContents[i].classList.remove('active');
        }
        const selectedContent = document.getElementById(selectedTab);
        if (selectedContent) selectedContent.classList.add('active');

        // Kích hoạt tab button
        const tabButtons = document.getElementsByClassName('tab-button');
        for (let i = 0; i < tabButtons.length; i++) {
            tabButtons[i].classList.remove('active');
        }
        const selectedButton = document.querySelector(`.tab-button[data-tab="${selectedTab}"]`);
        if (selectedButton) selectedButton.classList.add('active');
    });

    function checkPassword() {
        const password = document.getElementById('register-password').value;
        const strengthBar = document.getElementById('password-strength');

        if (!strengthBar.querySelector('div')) {
            const innerBar = document.createElement('div');
            strengthBar.appendChild(innerBar);
        }

        const innerBar = strengthBar.querySelector('div');

        // Password strength logic
        let strength = 0;
        if (password.length >= 7) strength += 25;
        if (password.match(/[a-z]+/)) strength += 25;
        if (password.match(/[A-Z]+/)) strength += 25;
        if (password.match(/[0-9]+/)) strength += 25;

        innerBar.style.width = strength + '%';

        if (strength < 25) {
            innerBar.style.backgroundColor = '#e74c3c';
        } else if (strength < 50) {
            innerBar.style.backgroundColor = '#e67e22';
        } else if (strength < 75) {
            innerBar.style.backgroundColor = '#f1c40f';
        } else {
            innerBar.style.backgroundColor = '#27ae60';
        }
    }

</script>
</body>
</html>
