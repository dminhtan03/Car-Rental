<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <title>Dreams Rent | Template</title>

    <!-- Favicon -->
    <link rel="shortcut icon" th:href="@{/assets/img/favicon.png}">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">

    <!-- Fontawesome CSS -->
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/fontawesome.min.css}">
    <link rel="stylesheet" th:href="@{/assets/plugins/fontawesome/css/all.min.css}">

    <!-- Feather CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/feather.css}">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
    <style>
        ul.breadcrumb {
          padding: 20px;
          list-style: none;
          margin: 0;
        }
        ul.breadcrumb li {
          display: inline;
          font-size: 18px;
        }
        ul.breadcrumb li+li:before {
          padding: 8px;
          color: black;
          content: ">\00a0";
        }

        ul.breadcrumb li a {
          color: #0275d8;
          text-decoration: none;
        }
        ul.breadcrumb li a:hover {
          color: #01447e;
          text-decoration: underline;
        }
        
        /* Thêm CSS cho nút Discard và Save để căn giữa */
        .profile-submit-btn {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .password-input-wrapper {
            position: relative;
            max-width: 500px;
        }

        .password-input-wrapper input {
            padding-right: 40px; /* Chừa chỗ cho icon */
        }

        .password-input-wrapper .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #555;
        }

    </style>
</head>
<body>

<!-- Main Wrapper -->
<div class="main-wrapper">

    <div th:insert="~{header :: header}"></div>
    <!-- Breadcrumb Section -->
        <ul class="breadcrumb">
            <li><a href="/">Home</a></li>
            <li>My Profile</li>
        </ul>

    <!-- Page Content -->
    <div class="content">
        <div class="container">
            <!-- Content Header -->
            <div class="content-header content-settings-header">
                <h4>Settings</h4>
            </div>
            <!-- /Content Header -->

            <div class="row">
                <div class="col-lg-12">
                    <div class="settings-info">
                        <!-- Tab Navigation -->
                        <ul class="nav nav-tabs" id="profileTabs">
                            <li class="nav-item">
                                <a class="nav-link active" id="personal-tab" data-bs-toggle="tab" href="#personal">Personal Information</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" id="security-tab" data-bs-toggle="tab" href="#security">Security</a>
                            </li>
                        </ul>

                        <!-- Tab Content -->
                        <div class="tab-content mt-3">
                            <!-- Personal Information Tab -->
                            <div class="tab-pane fade show active" id="personal">
                                <form th:action="@{/myProfile}" method="post" th:object="${user}"
                                      enctype="multipart/form-data">
                                    <div th:if="${error1}" th:text="${error1}" id="error-personal" class="alert alert-danger"></div>
                                    <div th:if="${success1}" th:text="${success1}" id="success-personal" class="alert alert-success"></div>
                                    <input type="hidden" th:field="*{userId}">

                                    <!-- Basic Info -->
                                    <div class="profile-info-grid">
                                        <div class="profile-info-header">
                                            <h5>Basic Information</h5>
                                            <p>Information about user</p>
                                        </div>
                                        <div class="profile-inner">
                                            <div class="row">
                                                <div class="col-md-4">
                                                    <div class="profile-form-group">
                                                        <label>Full Name <span class="text-danger">*</span></label>
                                                        <input type="text" class="form-control"
                                                               placeholder="Enter Full Name" th:field="*{fullName}"
                                                               required>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="profile-form-group">
                                                        <label>Date of Birth</label>
                                                        <input type="date" class="form-control" id="dob" name="dob" 
                                                               th:value="${formattedDob}" 
                                                               placeholder="Date of Birth">
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="profile-form-group">
                                                        <label>National ID No <span class="text-danger">*</span></label>
                                                        <input type="text" class="form-control"
                                                               placeholder="Enter National ID" th:field="*{nationalId}"
                                                               required>
                                                        <small class="text-danger" th:if="${nationError}"
                                                               th:text="${nationError}"></small>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>Phone Number <span class="text-danger">*</span></label>
                                                        <input type="text" class="form-control"
                                                               placeholder="Enter Phone Number" th:field="*{phone}"
                                                               required>
                                                        <small class="text-danger" th:if="${phoneError}"
                                                               th:text="${phoneError}"></small>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>Email <span class="text-danger">*</span></label>
                                                        <input type="email" class="form-control"
                                                               placeholder="Enter Email" th:field="*{email}"
                                                               readonly="true" required>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>Driving License (Upload File):</label>
                                                        <input type="file"
                                                               class="form-control"
                                                               id="drivingLicenseFile"
                                                               name="drivingLicenseFile"
                                                               accept="image/*"
                                                               onchange="previewImageFile()">

                                                        <!-- Xem trước ảnh khi chọn file -->
                                                        <div id="previewContainer"
                                                             style="display: none; margin-top: 10px;">
                                                            <p>Ảnh xem trước:</p>
                                                            <img id="previewImageFile"
                                                                 class="img-thumbnail"
                                                                 style="max-width: 100%; height: auto;">
                                                        </div>

                                                        <!-- Hiển thị ảnh đã lưu trong DB -->
                                                        <div th:if="*{userId}">
                                                            <p>Ảnh đã lưu:</p>
                                                            <img th:src="@{'/api/image/' + ${user.userId}}"
                                                                 alt="Driving License"
                                                                 style="max-width: 100%; height: auto;">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- /Basic Info -->

                                    <!-- Address Info -->
                                    <div class="profile-info-grid">
                                        <div class="profile-info-header">
                                            <h5>Address Information</h5>
                                            <p>Information about address of user</p>
                                        </div>
                                        <div class="profile-inner">
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>City/Province <span class="text-danger">*</span></label>
                                                        <select class="form-control" id="city" name="city"
                                                                th:field="*{address.ward.cityProvince}"
                                                                onchange="fetchDistricts()" required>
                                                            <option value="">Select City</option>
                                                            <th:block th:each="city : ${cities}">
                                                                <option th:value="${city}" th:text="${city}"></option>
                                                            </th:block>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>District <span class="text-danger">*</span></label>
                                                        <select class="form-control" id="district" name="district"
                                                                th:field="*{address.ward.district}"
                                                                onchange="fetchWards()" required>
                                                            <option value="">Select District</option>
                                                            <option th:each="d : ${districts}" th:value="${d}"
                                                                    th:text="${d}"></option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>Ward <span class="text-danger">*</span></label>
                                                        <select class="form-control" id="ward" name="ward"
                                                                th:field="*{address.wardCode}" required>
                                                            <option value="">Select Ward</option>
                                                            <option th:each="w : ${wards}" th:value="${w.wardCode}"
                                                                    th:text="${w.ward}"></option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="profile-form-group">
                                                        <label>House Number, Street <span
                                                                class="text-danger">*</span></label>
                                                        <input type="text" class="form-control"
                                                               placeholder="House number, Street"
                                                               th:field="*{address.addressNumber}" required>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- /Address Info -->

                                    <!-- Submit Buttons -->
                                    <div class="profile-submit-btn">
                                        <button type="reset" class="btn btn-secondary">Discard</button>
                                        <button type="submit" class="btn btn-primary">Save</button>
                                    </div>

                                </form>
                            </div>

                            <!-- Security Tab -->
                            <div class="tab-pane fade" id="security">
                                <form th:action="@{/myProfile/changePassword}" method="post" th:object="${changePasswordDTO}">
                                    <div th:if="${error2}" th:text="${error2}" id="error-security" class="alert alert-danger"></div>
                                    <div th:if="${success2}" th:text="${success2}" id="success-security" class="alert alert-success"></div>
                                    <input type="hidden" name="userId" th:value="${user.userId}">
                                    <h5>Change Password</h5>

                                    <div class="profile-form-group">
                                        <label>New Pass <span class="text-danger">*</span></label>
                                        <div class="password-input-wrapper">
                                            <input type="password" id="newPassword" class="form-control" required th:field="*{newPassword}">
                                            <span class="toggle-password" onclick="togglePassword('newPassword')">
                    <i class="fas fa-eye" id="eye-icon-newPassword"></i>
                </span>
                                        </div>
                                    </div>

                                    <div class="profile-form-group">
                                        <label>Confirm Pass <span class="text-danger">*</span></label>
                                        <div class="password-input-wrapper">
                                            <input type="password" id="confirmPassword" class="form-control" required th:field="*{confirmPassword}">
                                            <span class="toggle-password" onclick="togglePassword('confirmPassword')">
                    <i class="fas fa-eye" id="eye-icon-confirmPassword"></i>
                </span>
                                        </div>
                                    </div>

                                    <div class="profile-submit-btn">
                                        <button type="reset" class="btn btn-secondary">Discard</button>
                                        <button type="submit" class="btn btn-primary">Save</button>
                                    </div>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- /Page Content -->

    <!-- Footer -->
    <div th:insert="~{footer :: footer}"></div>
    <!-- /Footer -->

</div>
<!-- /Main Wrapper -->

<!-- scrollToTop -->
<div class="progress-wrap active-progress">
    <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98"
              style="transition: stroke-dashoffset 10ms linear 0s; stroke-dasharray: 307.919px, 307.919px; stroke-dashoffset: 228.265px;"></path>
    </svg>
</div>
<!--<div th:insert="~{footer :: footer}"></div>-->
<!-- Scripts -->
<script th:src="@{/assets/js/jquery-3.7.1.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/assets/js/backToTop.js}"></script>
<script th:src="@{/assets/plugins/theia-sticky-sidebar/ResizeSensor.js}"></script>
<script th:src="@{/assets/plugins/theia-sticky-sidebar/theia-sticky-sidebar.js}"></script>
<script th:src="@{/assets/js/script.js}"></script>

<!-- Custom JavaScript -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const addressNumberInput = document.querySelector('input[th\\:field="*{address.addressNumber}"]');
        if (addressNumberInput) {
            addressNumberInput.addEventListener('input', function(e) {
                // Remove any characters that don't match the pattern
                this.value = this.value.replace(/[^0-9A-Za-z\s-]/g, '');
            });
            
            // Add validation message
            const form = addressNumberInput.closest('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const value = addressNumberInput.value;
                    if (!/^[0-9A-Za-z\s-]+$/.test(value)) {
                        e.preventDefault();
                        alert('Address number can only contain letters, numbers, spaces, and hyphens.');
                    }
                });
            }
        }
    });
    document.addEventListener("DOMContentLoaded", function () {
        let targetTab = "#personal"; // mặc định

        const personalError = document.getElementById("error-personal");
        const personalSuccess = document.getElementById("success-personal");
        const securityError = document.getElementById("error-security");
        const securitySuccess = document.getElementById("success-security");

        const isVisible = el => el && el.offsetParent !== null && el.textContent.trim().length > 0;

        // Ưu tiên hiển thị tab có lỗi/success
        if (isVisible(securityError) || isVisible(securitySuccess)) {
            targetTab = "#security";
            localStorage.removeItem("selectedTab");
        } else if (isVisible(personalError) || isVisible(personalSuccess)) {
            targetTab = "#personal";
            localStorage.removeItem("selectedTab");
        } else {
            targetTab = localStorage.getItem("selectedTab") || "#personal";
        }

        // Mở tab tương ứng
        const tabTrigger = document.querySelector(`a[href="${targetTab}"]`);
        if (tabTrigger) {
            new bootstrap.Tab(tabTrigger).show();
        }

        // Lưu tab người dùng chọn thủ công
        const tabLinks = document.querySelectorAll('a[data-bs-toggle="tab"]');
        tabLinks.forEach(tab => {
            tab.addEventListener('shown.bs.tab', function (event) {
                localStorage.setItem("selectedTab", event.target.getAttribute("href"));
            });
        });
    });

    function togglePassword(fieldId) {
        const input = document.getElementById(fieldId);
        const icon = document.getElementById("eye-icon-" + fieldId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

</script>

</body>
</html>
